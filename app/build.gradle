plugins {
    id 'com.android.application'
}

android {
    namespace 'in.webipedia.app'
    compileSdk 35

    defaultConfig {
        applicationId 'in.webipedia.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Prevent old Kotlin JDK7/JDK8 stdlib artifacts from being pulled alongside
// kotlin-stdlib. Kotlin 1.8+ includes these JDK-specific classes in the main
// stdlib, so keeping the legacy artifacts causes duplicate-class failures.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
